# Decision trees (section 6). Questions run in order. A branch that is not written
# (yes or no missing) means "go to the next question". "check" names a rule in
# t3desk/rules.py; "screen" names a screen key.

system_design:            # Thiết kế hệ thống
  - q: "Mọi yêu cầu đã có mã R và mức Bắt buộc / Mong muốn?"
    check: requirements_complete
    help: "Mỗi yêu cầu có mã R (R1, R2...), mô tả, mức Bắt buộc hoặc Mong muốn, và nên có tiêu chí nghiệm thu đo được (ví dụ: tỷ lệ bắt mồi từ 60 %). Bắt buộc = thiếu thì hệ thống không đạt."
    no: {do: "Ghi yêu cầu", screen: yeu_cau}
  - q: "Đã có ít nhất 2 kiến trúc để so sánh?"
    check: two_architectures
    help: "Kiến trúc là cách làm khác nhau về nguyên lý, không phải hai phiên bản của cùng một cách. Cần ít nhất hai để so sánh."
    no: {do: "Nêu thêm kiến trúc khác về nguyên lý", screen: kien_truc}
  - q: "Đã chọn đúng một kiến trúc, có lý do?"
    check: one_architecture_chosen
    help: "Chấm điểm 1 đến 5 cho kỹ thuật, nguồn hàng, thời gian. Tổng có trọng số = 0,5 x kỹ thuật + 0,3 x nguồn hàng + 0,2 x thời gian (trọng số trong Cài đặt). Chỉ Thiết kế hệ thống được chọn; chọn đúng một và ghi lý do."
    no: {do: "Chấm 3 điểm, chọn một, ghi lý do", screen: kien_truc}
  - q: "Đã liệt kê đủ nút cấp 1 và chốt?"
    check: gate_level_1
    help: "Cấp 1 là các cụm lớn dưới nút gốc N0 (N1, N2...). Liệt kê đủ rồi bật công tắc Chốt cấp 1. Chưa tách cấp 2."
    no: {do: "Liệt kê nút cấp 1, rồi chốt. Chưa tách cấp 2.", screen: cay}
  - q: "Nút cấp 1 không mua được nguyên khối đã tách cấp 2 và chốt?"
    check: gate_level_2
    help: "Cấp 2 (N1.1, N1.2...) là nút lá: thứ có thể mua hoặc giao cho một người. Mỗi nút lá cần người phụ trách. Bật Chốt cấp 2 khi xong; sau đó mới viết thông số và tìm OEM."
    no: {do: "Tách cấp 2, rồi chốt. Chưa tìm OEM.", screen: cay}
  - q: "Mọi yêu cầu Bắt buộc đã phân bổ về nút?"
    check: all_must_allocated
    help: "Phân bổ nối một yêu cầu với một nút: mỗi cặp yêu cầu + nút một dòng. Kiểu: Mỗi nút phải đạt (mọi nút đều phải đạt giá trị đó), Chia ngân sách (mỗi nút nhận một phần của giới hạn), Một nút gánh (chỉ một nút chịu), Kiểm ở cấp hệ thống (đo trên cả hệ thống, dùng cho nút cha)."
    no: {do: "Phân bổ: mỗi cặp yêu cầu + nút một dòng", screen: phan_bo}
  - q: "Có yêu cầu chia ngân sách đang vượt giới hạn?"
    check: budget_over
    help: "Giá trị phân bổ là phần của giới hạn hệ thống giao cho nút (ví dụ khối lượng 10 kg chia 4 kg + 3 kg + 2 kg). Cách cộng: Cộng = cộng thẳng; RSS = căn bậc hai tổng bình phương, dùng cho sai số độc lập. Tổng vượt Giới hạn hệ thống thì phải chia lại."
    yes: {do: "Chia lại phần của từng nút", screen: phan_bo}
  - q: "Mọi nút lá có người phụ trách, nút nghi chờ lâu xếp trước?"
    check: leaves_assigned
    help: "Điền Phụ trách cho từng nút lá. Một người chỉ nên mở một nút ở bước 3, 4, 5 cùng lúc; nút nghi chờ lâu (hàng đặt theo đơn) nên xếp trước."
    no: {do: "Giao nút lá", screen: cay}
  - q: "Có nút báo không ứng viên nào đạt?"
    check: any_node_stuck
    help: "Nút báo không ứng viên nào đạt: không tự nới thông số. Thiết kế hệ thống quyết định nới yêu cầu, tách nút khác đi, hoặc đổi kiến trúc."
    yes: {do: "Quyết định: nới yêu cầu, tách nút khác đi, hoặc đổi kiến trúc", screen: cay}
    no: {do: "So sánh phương án ở buổi rà soát tuần", screen: tong_quan}

designer:                 # Thiết kế nút, cho một nút lá
  - q: "Cây hệ thống đã chốt cấp 2?"
    check: gate_level_2
    help: "Chưa chốt cấp 2 thì chưa viết thông số hay tìm OEM, nếu không sẽ báo Đi sâu quá sớm."
    no: {do: "Chờ. Không viết thông số, không tìm OEM."}
  - q: "Bạn đang mở nút khác chưa xong?"
    check: other_node_open
    help: "Mỗi người một nút tại một thời điểm (bước 3 đến 5). Nút đang chờ Mua hàng không tính."
    yes: {do: "Làm xong nút đó trước", screen: nut}
  - q: "Nút đã có thông số cho mọi yêu cầu được phân bổ?"
    check: node_specs_cover_allocation
    help: "Thông số là một con số hoặc điều kiện kiểm được: Min và/hoặc Max, đơn vị, mức (Bắt buộc/Mong muốn), mã yêu cầu gốc (R... hoặc Dẫn xuất nếu suy ra), cách kiểm chứng. Mỗi yêu cầu đã phân bổ cho nút phải có ít nhất một thông số."
    no: {do: "Viết thông số: min hoặc max, đơn vị, mức, mã yêu cầu gốc", screen: nut}
  - q: "Đã có đủ ứng viên (3 đến 5)?"
    check: node_enough_candidates
    help: "Ứng viên là một sản phẩm cụ thể (hãng, model) có thể đáp ứng. Cần link datasheet và ngày kiểm tra. Nút Mua OEM cần 3 đến 5 ứng viên, loại khác cần ít nhất 1."
    no: {do: "Tìm ứng viên, có link datasheet và ngày kiểm tra", screen: nut}
  - q: "Mọi cặp ứng viên × thông số đã đối chiếu, có trích dẫn?"
    check: node_checks_complete
    help: "Đối chiếu: mỗi ô ứng viên x thông số ghi giá trị từ datasheet (đã quy đổi về đơn vị của thông số), trích nguyên văn và số trang. Hoặc chọn Đạt / Không đạt nếu không có số."
    no: {do: "Đối chiếu datasheet: nguyên văn, số đã quy đổi, trang", screen: nut}
  - q: "Có ứng viên đạt mọi thông số Bắt buộc?"
    check: node_has_passing_candidate
    help: "Ứng viên đạt khi mọi thông số Bắt buộc đạt. Không có ứng viên đạt thì báo Thiết kế hệ thống."
    no: {do: "Báo Thiết kế hệ thống. Không tự nới thông số."}
  - q: "Mua hàng đã có giá báo và thời gian chờ?"
    check: node_sourcing_answered
    help: "Mua hàng nhập nhà cung cấp, đơn giá báo, tình trạng nguồn và thời gian chờ (tuần). Ngày phải đặt = mốc G4a trừ thời gian chờ. Có đủ giá và thời gian chờ thì chọn ứng viên, ghi lý do, gắn phương án (PA-A...)."
    no: {do: "Nút chuyển sang Chờ Mua hàng. Bạn được mở nút tiếp theo.", screen: mua_hang}
    yes: {do: "Chọn một ứng viên, ghi lý do, gắn phương án", screen: nut}

engineer:                 # Kỹ sư, mỗi ngày
  - q: "Có bản nháp chưa commit?"
    check: has_drafts
    help: "Bản nháp chỉ nằm trên máy bạn cho đến khi Commit. Trùng mã với người khác: nhận mã mới ứng dụng đề xuất, dữ liệu của họ không bị đổi."
    yes: {do: "Commit. Nếu trùng mã: nhận mã mới mà ứng dụng đề xuất.", screen: commit}
  - q: "Có cảnh báo đỏ ở dòng của bạn?"
    check: my_warnings
    help: "Cảnh báo đỏ nằm trên dòng của nút bạn phụ trách. Sửa trước khi làm việc mới."
    yes: {do: "Sửa trước khi làm việc mới", screen: tong_quan}
  - q: "Có thẻ sai lệch giao cho bạn?"
    check: my_change_cards
    help: "Thẻ sai lệch báo một thay đổi ảnh hưởng nút của bạn. Làm lại từ bước thông số."
    yes: {do: "Làm lại đúng nút bị ảnh hưởng, từ bước thông số", screen: nut}
  - q: "Nút của bạn còn việc tiếp theo?"
    check: my_next_actions
    help: "Xem việc tiếp theo của từng nút ở Tổng quan hoặc cột Việc tiếp theo ở Cây hệ thống."
    yes: {do: "Làm theo cây Thiết kế nút", screen: nut}
    no: {do: "Hỏi Thiết kế hệ thống để nhận nút mới"}
  - q: "Cuối ngày: các số kiểm tra đã về 0?"
    check: counters_zero
    help: "Bảy số kiểm tra ở Tổng quan nên về 0 vào cuối ngày. Số khác 0 thì nêu ở giao ban sáng."
    no: {do: "Nêu ở giao ban 15 phút sáng mai", screen: tong_quan}

# Glossary shown under the tree: what the words and fields mean.
guide:
  - term: "Giá trị phân bổ"
    text: "Phần của một yêu cầu giao cho một nút. Ví dụ yêu cầu khối lượng tối đa 10 kg, nút N1.1 nhận 4 kg, N1.2 nhận 3 kg, N2.1 nhận 2 kg, còn 1 kg dự phòng. Ghi kèm Đơn vị. Chỉ dùng với kiểu Chia ngân sách."
  - term: "Giới hạn hệ thống"
    text: "Con số của cả hệ thống mà tổng các giá trị phân bổ không được vượt (10 kg trong ví dụ). Mọi dòng của cùng một yêu cầu phải ghi cùng giới hạn."
  - term: "Cách cộng (Cộng / RSS)"
    text: "Cộng: tổng thẳng, dùng cho khối lượng, chi phí, công suất. RSS: căn bậc hai của tổng bình phương, dùng cho sai số hoặc nhiễu độc lập."
  - term: "Kiểu phân bổ"
    text: "Mỗi nút phải đạt: nút nào cũng phải đạt giá trị này. Chia ngân sách: mỗi nút nhận một phần. Một nút gánh: chỉ một nút chịu yêu cầu. Kiểm ở cấp hệ thống: đo trên cả hệ thống, dùng cho nút cha hoặc nút gốc."
  - term: "Thông số"
    text: "Điều kiện kiểm được của nút lá. Kiểu Số cần Min hoặc Max và đơn vị; kiểu Định tính cần mô tả mong đợi. Mức Bắt buộc: không đạt thì loại ứng viên."
  - term: "Mã yêu cầu gốc"
    text: "Yêu cầu R... mà thông số này phục vụ. Ghi Dẫn xuất nếu thông số suy ra từ thiết kế chứ không từ yêu cầu nào."
  - term: "Ứng viên và đối chiếu"
    text: "Ứng viên là sản phẩm cụ thể. Đối chiếu là ô ứng viên x thông số: giá trị từ datasheet đã quy đổi, trích nguyên văn, số trang. Thiếu trích dẫn hoặc trang sẽ bị cảnh báo."
  - term: "Phương án (PA-A, PA-B)"
    text: "Gắn ứng viên với kiến trúc dùng nó, ví dụ PA-A cho KT-A. Nhiều phương án ngăn cách bằng dấu chấm phẩy."
  - term: "Nút gắn kiến trúc (ma_kt)"
    text: "Ghi KT-B vào nút nếu nút chỉ thuộc kiến trúc đó. Khi KT-B bị Loại, nút đó và các nút con thôi được tính. Để trống nếu nút dùng chung mọi kiến trúc."
  - term: "Thời gian chờ và ngày phải đặt"
    text: "Thời gian chờ tính bằng tuần theo báo giá. Ngày phải đặt = ngày mốc G4a trừ thời gian chờ; quá hạn thì có cảnh báo."
  - term: "Chốt cấp 1 và cấp 2"
    text: "Hai công tắc ở Cây hệ thống, chỉ Thiết kế hệ thống bật được. Chốt cấp 1 rồi mới tách cấp 2; chốt cấp 2 rồi mới viết thông số và tìm OEM."
