# T3 Desk schema. Single source for bootstrap, forms, validation and labels.
# Adding a field means editing this file (and labels_vi.yaml), nothing else.
#
# Field spec keys:
#   type      text | longtext | number | choice | date
#   unique / notNull   Teable field flags (ID fields: both true)
#   required  form must supply a value
#   choices   allowed values for type choice
#   ref       table key whose ID field the value must match (validated before commit)
#   ref_extra literal values accepted in addition to referenced IDs
#   multi     separator when the cell holds several codes, e.g. ";"
#   min/max   numeric bounds for validation
#   default   value a new form starts with
#
# ID spec keys (per table, under "id"):
#   kind      number     prefix + integer, zero padded to "pad"   (R12, PB-001)
#             letter     prefix + one letter A..Z                  (KT-A)
#             tree       N0, N1, N1.1, N1.1.1 (needs a parent to propose a child)
#             free       user-typed text after a prefix            (G4a)
#             reference  must equal an existing ID of table "ref"  (mua_hang.ma_uv)
#             composite  built by the app from other fields        (doi_chieu, cong_viec)
#             key        fixed or free key                         (cai_dat)
#   prefix / prefixes   prefix(es) used to propose the next free ID
#   pad       zero padding width
#   pattern   regular expression the whole ID must match
#   example   shown in forms

version: 1

# Added by bootstrap to every table (Teable computes them).
system_fields:
  - {name: auto_number, type: autoNumber}
  - {name: created_time, type: createdTime}
  - {name: last_modified_time, type: lastModifiedTime}
  - {name: created_by, type: createdBy}
  - {name: last_modified_by, type: lastModifiedBy}

# Table used by bootstrap to prove that a duplicate ID is refused.
# Nothing is ever deleted, so this table stays in the base.
scratch_table:
  name: zz_scratch_check
  id_field: ma

tables:

  yeu_cau:
    id_field: ma_yc
    id: {kind: number, prefix: "R", pad: 0, pattern: '^R\d+$', example: R12}
    fields:
      ma_yc: {type: text, unique: true, notNull: true, required: true}
      mo_ta: {type: longtext, required: true}
      tieu_chi_nghiem_thu: {type: longtext}
      muc: &muc {type: choice, required: true, choices: ["Bắt buộc", "Mong muốn"]}
      uu_tien: {type: choice, choices: [H, M, L]}
      nguon: {type: text}
      trang_thai: {type: choice, required: true, default: "Nháp", choices: ["Nháp", "Đã chốt", "Hủy"]}

  kien_truc:
    id_field: ma_kt
    id: {kind: letter, prefix: "KT-", pattern: '^KT-[A-Z]$', example: KT-A}
    fields:
      ma_kt: {type: text, unique: true, notNull: true, required: true}
      ten: {type: text, required: true}
      nguyen_ly: {type: longtext}
      he_con_cap1: {type: longtext}
      yc_then_chot: {type: text, ref: yeu_cau, multi: ";"}
      uu_diem: {type: longtext}
      nhuoc_diem: {type: longtext}
      rui_ro: {type: longtext}
      chi_phi_uoc_tr: {type: number}
      tg_uoc_tuan: {type: number}
      diem_ky_thuat: &score {type: number, min: 1, max: 5, integer: true}
      diem_nguon_hang: *score
      diem_thoi_gian: *score
      trang_thai: {type: choice, required: true, default: "Đề xuất", choices: ["Đề xuất", "Chọn", "Loại"]}
      ly_do: {type: longtext}

  nut:
    id_field: ma_nut
    id: {kind: tree, prefix: "N", pattern: '^N(0|[1-9]\d*(\.[1-9]\d*){0,2})$', example: N1.1}
    fields:
      ma_nut: {type: text, unique: true, notNull: true, required: true}
      ma_cha: {type: text, ref: nut}
      ten: {type: text, required: true}
      chuc_nang: {type: longtext}
      loai: {type: choice, required: true, choices: ["Hệ thống", "Cụm", "Mua OEM", "Tự chế tạo", "Phần mềm", "Dịch vụ"]}
      so_luong: {type: number, min: 0}
      phu_trach: {type: text}
      ghi_chu: {type: longtext}

  phan_bo:
    id_field: ma_pb
    id: {kind: number, prefix: "PB-", pad: 3, pattern: '^PB-\d{3,}$', example: PB-001}
    fields:
      ma_pb: {type: text, unique: true, notNull: true, required: true}
      ma_yc: {type: text, ref: yeu_cau, required: true}
      ma_nut: {type: text, ref: nut, required: true}
      kieu: {type: choice, required: true, choices: ["Mỗi nút phải đạt", "Chia ngân sách", "Một nút gánh", "Kiểm ở cấp hệ thống"]}
      gia_tri_phan_bo: {type: number}
      don_vi: {type: text}
      gioi_han_he_thong: {type: number}
      cach_cong: {type: choice, choices: ["Cộng", "RSS"]}
      cach_kiem_he_thong: {type: longtext}
      ghi_chu: {type: longtext}

  thong_so:
    id_field: ma_ts
    id: {kind: number, prefix: "TS-", pad: 3, pattern: '^TS-\d{3,}$', example: TS-001}
    fields:
      ma_ts: {type: text, unique: true, notNull: true, required: true}
      ma_nut: {type: text, ref: nut, required: true}
      ma_yc_goc: {type: text, ref: yeu_cau, ref_extra: ["Dẫn xuất"], required: true}
      thong_so: {type: text, required: true}
      kieu: {type: choice, required: true, choices: ["Số", "Định tính"]}
      gia_tri_min: {type: number}
      gia_tri_max: {type: number}
      don_vi: {type: text}
      mong_doi: {type: text}
      muc: *muc
      kiem_chung: {type: text}
      ghi_chu: {type: longtext}

  ung_vien:
    id_field: ma_uv
    id: {kind: number, prefix: "UV-", pad: 3, pattern: '^UV-\d{3,}$', example: UV-001}
    fields:
      ma_uv: {type: text, unique: true, notNull: true, required: true}
      ma_nut: {type: text, ref: nut, required: true}
      hang: {type: text}
      model: {type: text, required: true}
      cau_hinh: {type: longtext}
      xuat_xu: {type: text}
      gia_cong_bo: {type: number}
      tien_te: {type: text}
      loai_gia: {type: choice, choices: ["Giá công bố", "Ước lượng"]}
      link_datasheet: {type: text}
      link_gia: {type: text}
      ngay_kiem_tra: {type: date}
      nguoi_tim: {type: choice, choices: ["Người", "AI"]}
      nguoi_kiem_lai: {type: text}
      trang_thai: {type: choice, required: true, default: "Ứng viên", choices: ["Ứng viên", "Chọn", "Dự phòng", "Loại"]}
      ly_do: {type: longtext}
      phuong_an: {type: text, multi: ";"}

  # Inferred fields (not listed in the requirements): danh_gia_tay, gia_tri_so, trich_dan, trang, ghi_chu.
  doi_chieu:
    id_field: khoa
    id: {kind: composite, parts: [ma_uv, ma_ts], separator: "|", pattern: '^UV-\d{3,}\|TS-\d{3,}$', example: "UV-001|TS-003"}
    fields:
      khoa: {type: text, unique: true, notNull: true, required: true}
      ma_uv: {type: text, ref: ung_vien, required: true}
      ma_ts: {type: text, ref: thong_so, required: true}
      danh_gia_tay: {type: choice, choices: ["Đạt", "Không đạt", "Không rõ"]}
      gia_tri_so: {type: number}
      trich_dan: {type: longtext}
      trang: {type: text}
      ghi_chu: {type: longtext}

  mua_hang:
    id_field: ma_uv
    id: {kind: reference, ref: ung_vien, pattern: '^UV-\d{3,}$', example: UV-001}
    fields:
      ma_uv: {type: text, unique: true, notNull: true, required: true, ref: ung_vien}
      nha_cung_cap: {type: text}
      don_gia_bao: {type: number}
      tien_te: {type: text}
      # Six-step availability scale (inferred, see docs/notes/foundation.md), worst to best.
      tinh_trang_nguon: {type: choice, choices: ["Chưa hỏi", "Không có hàng", "Chỉ đặt theo đơn", "Hàng về chậm", "Có hàng một phần", "Có hàng sẵn"]}
      tg_cho_tuan: {type: number, min: 0}
      thay_the: {type: text, ref: ung_vien, multi: ";"}
      so_bao_gia: {type: text}
      bao_gia_het_han: {type: date}
      trang_thai_mua: {type: choice, default: "Mở", choices: ["Mở", "Đã báo giá", "Đóng"]}
      ghi_chu: {type: longtext}

  moc:
    id_field: ma_moc
    id: {kind: free, prefix: "G", pattern: '^G[0-9A-Za-z]+$', example: G4a}
    fields:
      ma_moc: {type: text, unique: true, notNull: true, required: true}
      ten: {type: text, required: true}
      ngay_co_so: {type: date}
      ngay_du_bao: {type: date}
      trang_thai: {type: choice, default: "Kế hoạch", choices: ["Kế hoạch", "Đang làm", "Xong", "Hủy"]}

  quyet_dinh:
    id_field: ma_qd
    id: {kind: number, prefix: "D", pad: 0, pattern: '^D\d+$', example: D3}
    fields:
      ma_qd: {type: text, unique: true, notNull: true, required: true}
      cau_hoi: {type: longtext, required: true}
      phuc_vu_moc: {type: text, ref: moc}
      ngay_du_bao: {type: date}
      ket_luan: {type: longtext}
      ngay_ket_luan: {type: date}

  sai_lech:
    id_field: ma_sl
    id: {kind: number, prefix: "SL-", pad: 3, pattern: '^SL-\d{3,}$', example: SL-001}
    fields:
      ma_sl: {type: text, unique: true, notNull: true, required: true}
      ngay: {type: date}
      mo_ta: {type: longtext, required: true}
      ma_nut: {type: text, ref: nut}
      nguoi_nhan: {type: text}
      han: {type: date}
      trang_thai: {type: choice, default: "Mở", choices: ["Mở", "Xong", "Hủy"]}

  cai_dat:
    id_field: khoa
    id: {kind: key, pattern: '^[a-z][a-z0-9_]*$', example: so_uv_toi_thieu}
    fields:
      khoa: {type: text, unique: true, notNull: true, required: true}
      gia_tri: {type: text}

  rfq:
    id_field: ma_rfq
    id: {kind: number, prefixes: ["RFQ-", "RFP-"], pad: 3, pattern: '^(RFQ|RFP)-\d{3,}$', example: RFQ-001}
    fields:
      ma_rfq: {type: text, unique: true, notNull: true, required: true}
      loai: {type: choice, required: true, choices: [RFQ, RFP]}
      ds_ma_uv: {type: text, ref: ung_vien, multi: ";"}
      ds_ma_nut: {type: text, ref: nut, multi: ";"}
      nha_cung_cap: {type: text}
      han_tra_loi: {type: date}
      trang_thai: {type: choice, required: true, default: "Nháp", choices: ["Nháp", "Đang tạo", "Đã tạo", "Đã gửi", "Đã có trả lời", "Hủy"]}
      plugin: {type: text}
      ma_tac_vu_ngoai: {type: text}
      link_tai_lieu: {type: text}
      ghi_chu: {type: longtext}

  cong_viec:
    id_field: ma_cv
    id: {kind: composite, parts: [nguon, subject], separator: "|", pattern: '^CV\|(buoc|cho_nhan|sai_lech|rfq|canh_bao)\|.+$', example: "CV|buoc|N3.1"}
    fields:
      ma_cv: {type: text, unique: true, notNull: true, required: true}
      nguon: {type: choice, required: true, choices: [buoc, cho_nhan, sai_lech, rfq, canh_bao]}
      tieu_de: {type: text, required: true}
      mo_ta: {type: longtext}
      ma_nut: {type: text, ref: nut}
      nguoi_nhan: {type: text}
      han: {type: date}
      trang_thai: {type: choice, required: true, default: "Mở", choices: ["Mở", "Xong", "Hủy"]}
      cap_nhat_luc: {type: date}
      ma_ngoai: {type: text}      # owned by Paperclip TODO AI; T3 Desk never writes it
      dong_bo_luc: {type: date}   # owned by Paperclip TODO AI; T3 Desk never writes it

# Rows written to cai_dat by bootstrap if the key is missing (never overwritten).
# "$project_name" is replaced by the project name given to bootstrap.
# Exchange rates are million VND per one unit of the currency (inferred).
defaults:
  cai_dat:
    - {khoa: ten_du_an, gia_tri: "$project_name"}
    - {khoa: ngan_sach_tr, gia_tri: "0"}
    - {khoa: so_uv_toi_thieu, gia_tri: "3"}
    - {khoa: so_uv_toi_da, gia_tri: "5"}
    - {khoa: chot_cap_1, gia_tri: "Không"}
    - {khoa: chot_cap_2, gia_tri: "Không"}
    - {khoa: trong_so_ky_thuat, gia_tri: "0.5"}
    - {khoa: trong_so_nguon_hang, gia_tri: "0.3"}
    - {khoa: trong_so_thoi_gian, gia_tri: "0.2"}
    - {khoa: ty_gia_VND, gia_tri: "0.000001"}
    - {khoa: ty_gia_USD, gia_tri: "0.025"}
    - {khoa: ty_gia_EUR, gia_tri: "0.027"}
