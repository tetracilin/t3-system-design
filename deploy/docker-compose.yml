# Teable Community + PostgreSQL + Redis for the office NAS.
# Image tags are pinned to exact versions (never "latest").
# VERIFY BEFORE USE: the tags below are not confirmed against Teable's release list or against the
# Teable version you intend to run. Check https://help.teable.ai/en/deploy/docker and the
# registry, edit the tags, and record the final Teable version in README.md.
# Variables come from deploy/.env (copy .env.example).

services:
  teable:
    image: ghcr.io/teableio/teable:v1.10.0   # VERIFY tag
    restart: unless-stopped
    ports:
      - "${TEABLE_PORT:-3000}:3000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      SECRET_KEY: ${SECRET_KEY}
      PRISMA_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@teable-db:5432/${POSTGRES_DB}
      BACKEND_CACHE_PROVIDER: redis
      BACKEND_CACHE_REDIS_URI: redis://default:${REDIS_PASSWORD}@teable-cache:6379/0
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      teable-db:
        condition: service_healthy
      teable-cache:
        condition: service_healthy
    volumes:
      - teable-data:/app/.assets

  teable-db:
    image: postgres:15.4   # VERIFY tag
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - teable-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  teable-cache:
    image: redis:7.2.4   # VERIFY tag
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - teable-cache:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  teable-data:
  teable-db:
  teable-cache:
