# Follows docs/reference/hermes-api-server.md (Runs API). UNVERIFIED parts: status values, document storage, skill names. See README.md.
id: hermes_skill
name: Hermes skill (RFQ / RFP)
version: 0.2.0
config:
  - {key: base_url, label: "Hermes API server address", default: "http://127.0.0.1:8642"}
  - {key: token, label: "Hermes API key (API_SERVER_KEY)", secret: true}
  - {key: skill_tao_rfq, label: "Skill name for Tạo RFQ (UNVERIFIED)", default: "rfq"}
  - {key: skill_tao_rfp, label: "Skill name for Tạo RFP (UNVERIFIED)", default: "rfp"}
hosts:
  - "{config:base_url}"
writes: [rfq]
actions:
  - {id: tao_rfq, label: "Tạo RFQ", screens: [mua_hang.selection, nut.current], roles: [system_designer, designer, engineer, sourcing, pm]}
  - {id: tao_rfp, label: "Tạo RFP", screens: [nut.current, rfq.row], roles: [system_designer, designer, engineer, pm]}
events: [on_job_poll]
